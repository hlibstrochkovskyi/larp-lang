[workspace]
members = ["crates/*", "experiments/scenario-model"]
default-members = ["crates/larp-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
larp-source = { path = "crates/larp-source" }
larp-diagnostics = { path = "crates/larp-diagnostics" }
larp-types = { path = "crates/larp-types" }
larp-syntax = { path = "crates/larp-syntax" }
larp-bytecode = { path = "crates/larp-bytecode" }
larp-ir = { path = "crates/larp-ir" }
larp-compiler = { path = "crates/larp-compiler" }
larp-vm = { path = "crates/larp-vm" }
larp-artifact = { path = "crates/larp-artifact" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
