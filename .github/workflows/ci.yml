name: Compiler and conformance

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - run: cargo test --workspace --locked --offline
      - run: cargo test -p larp-compiler --release --locked --offline
      - run: python3 tools/check_corpus.py
      - run: python3 tools/check_version.py --bin target/debug/larp --output artifacts/version-contract
      - run: python3 -m unittest discover -s tools -p 'test_candidate_checks.py'
      - run: python3 tools/run_conformance.py
      - run: python3 tools/run_conformance.py --gc-stress
      - run: python3 tools/run_conformance.py --artifacts --gc-stress
      - run: python3 tools/run_conformance.py --formatted --artifacts --gc-stress
      - run: python3 tools/run_reference.py
      - run: python3 tools/run_reference.py --document README.md --contracts docs/readme-cases.json --output artifacts/readme-validation
      - run: python3 tools/run_projects.py --bin target/debug/larp --output artifacts/project-validation
      - run: python3 tools/check_project_workflow.py --bin target/debug/larp --output artifacts/project-workflow
      - run: python3 tools/measure_resources.py --samples 1 --output artifacts/ci-resources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-evidence
          path: artifacts/ci-resources/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: version-contract
          path: artifacts/version-contract/version-report.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-contract
          path: |
            artifacts/project-validation/project-report.json
            artifacts/project-workflow/workflow-report.json
          retention-days: 14

  reproducible-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/check_reproducible_build.py --output artifacts/reproducible-builds/ci
      - run: python3 tools/package_candidate.py --report artifacts/reproducible-builds/ci/report.json --output artifacts/package-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducibility-evidence
          path: |
            artifacts/reproducible-builds/*/report.json
            artifacts/reproducible-builds/*/*/build.stdout.txt
            artifacts/reproducible-builds/*/*/build.stderr.txt
            artifacts/package-ci/package-report.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: larp-candidate-linux-x86_64
          path: |
            artifacts/package-ci/larp-*.tar.gz
            artifacts/package-ci/larp-*.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error

  candidate-compatibility:
    needs: reproducible-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: larp-candidate-linux-x86_64
          path: artifacts/downloaded-candidate
      - name: Verify and execute the existing candidate
        run: python3 tools/check_candidate.py --input artifacts/downloaded-candidate --revision "${{ github.sha }}" --output artifacts/candidate-compatibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-compatibility-${{ matrix.os }}
          path: |
            artifacts/candidate-compatibility/compatibility-report.json
            artifacts/candidate-compatibility/version-contract/version-report.json
            artifacts/candidate-compatibility/projects/project-report.json
            artifacts/candidate-compatibility/project-workflow/workflow-report.json
          retention-days: 14

  candidate-matrix:
    needs: candidate-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-compatibility-*
          path: artifacts/candidate-matrix-input
      - name: Require both platforms to have executed identical candidate bytes
        run: python3 tools/check_candidate_matrix.py --input artifacts/candidate-matrix-input --revision "${{ github.sha }}" --output artifacts/candidate-matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-matrix
          path: artifacts/candidate-matrix/matrix-report.json
          retention-days: 14
